<!DOCTYPE html>
<html>
<head>
<title>Filter Profiles</title>
<style>
body{
    font-family:Segoe UI;
    background:#f8fafc;
    padding:30px;
}
h1{
    margin-bottom:20px;
}
select{
    padding:10px;
    font-size:16px;
    margin-bottom:20px;
}
.card{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:10px;
    box-shadow:0 5px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<h1>Filter by Research Area</h1>

<select>
    <option>Select Research Area</option>
    <option>Artificial Intelligence</option>
    <option>Machine Learning</option>
    <option>Software Engineering</option>
    <option>Data Science</option>
</select>

<div class="card">
    <h3>Dr. Ahmed Rahman</h3>
    <p>Research Area: AI, NLP</p>
</div>

<div class="card">
    <h3>Dr. Nasreen Sultana</h3>
    <p>Research Area: Software Engineering</p>
</div>

</body>
</html>
