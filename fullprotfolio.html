<!DOCTYPE html>
<html>
<head>
<title>Full Profile</title>
<style>
body{
    font-family:Segoe UI;
    background:#f1f5f9;
    padding:30px;
}
.profile{
    max-width:600px;
    background:white;
    margin:auto;
    padding:30px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
h1{
    margin-bottom:10px;
}
p{
    margin:8px 0;
}
.status{
    margin-top:15px;
    font-weight:600;
    color:green;
}
button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    background:#1e293b;
    color:white;
    border-radius:25px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="profile">
    <h1>Dr. Ahmed Rahman</h1>
    <p><b>Designation:</b> Associate Professor</p>
    <p><b>Department:</b> CSE</p>
    <p><b>Research Area:</b> AI, NLP, Data Science</p>
    <p><b>Max Students:</b> 5</p>
    <p><b>Available Seats:</b> 2</p>

    <div class="status">Currently Accepting Students</div>

    <button>Send Thesis Application</button>
</div>

</body>
</html>
